<svg xmlns="http://www.w3.org/2000/svg" width="880" height="766" viewBox="0 0 880 766" role="img" aria-labelledby="map-title map-desc">
<title id="map-title">LLM implementation learning roadmap</title>
<desc id="map-desc">Build the model: Causal attention (Complete), Norms &amp; MLPs (Complete), Position encodings (Complete), Transformer decoder (Complete), Stable cross-entropy (Complete), Train a decoder (Complete); Make it generate: Byte-level BPE (Complete), KV caching (Complete), MQA &amp; GQA (Complete), Greedy &amp; sampling (Complete), Speculative decoding (Complete), Efficient inference (Planned); Rethink attention: Sliding-window attention (Complete), Linear → DeltaNet (Complete), Kimi Delta Attention (Complete), Latent attention (In progress), Long-context RoPE (Planned), FlashAttention (Deferred); Scale the compute: Mixture of Experts (Complete), Expert parallelism (Complete), LatentMoE &amp; balancing (Complete), FLOPs &amp; memory (Planned), Precision &amp; quantization (Planned), Distributed systems (Planned); Train &amp; adapt: Training &amp; evaluation (Planned), Fine-tuning (Planned), PPO (Planned), GRPO (Planned), A small autograd engine (Planned). Tracks group topics, not strict prerequisites.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#e6edf3}.lane{font-size:19px;font-weight:600}.topic{font-size:15px;font-weight:500}.status{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:10px;letter-spacing:.4px;fill:#9da7b3}</style>
