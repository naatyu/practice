<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Local README rendering check</title>
  <style>
    :root { color-scheme: light dark; --bg: #fff; --ink: #1f2328; --muted: #59636e; --line: #d1d9e0; --link: #0969da; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0d1117; --ink: #e6edf3; --muted: #9da7b3; --line: #30363d; --link: #58a6ff; } }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    main { max-width: 944px; margin: 32px auto; padding: 0 32px; }
    h1, h2 { line-height: 1.25; padding-bottom: .3em; border-bottom: 1px solid var(--line); }
    h1 { font-size: 2em; margin: 0 0 16px; }
    h2 { font-size: 1.5em; margin: 24px 0 16px; }
    p { margin: 0 0 16px; }
    img { display: block; max-width: 100%; height: auto; background: transparent; }
    a { color: var(--link); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .note { color: var(--muted); font-size: 13px; margin-top: 32px; }
    @media (max-width: 767px) { main { padding: 0 20px; margin-block: 24px; } }
  </style>
</head>
<body>
  <main>
    <h2>Learning roadmap</h2>
    <picture>
  <source media="(max-width: 767px) and (prefers-color-scheme: dark)" srcset="roadmap-dark-mobile.svg">
  <source media="(max-width: 767px)" srcset="roadmap-light-mobile.svg">
  <source media="(prefers-color-scheme: dark)" srcset="roadmap-dark.svg">
  <img src="roadmap-light.svg" width="880" alt="Five learning tracks: model foundations and core generation are complete; attention includes exploratory MLA and deferred FlashAttention; systems and adaptation include planned work. See the detailed roadmap for scope and prerequisites.">
</picture>
  </main>
</body>
</html>
