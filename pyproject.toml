[project]
name = "practice"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "regex>=2026.7.19",
    "torch>=2.13.0",
]

[project.optional-dependencies]
plots = ["matplotlib"]

[dependency-groups]
dev = [
    "pytest",
]

# Keep the Linux workstation compatible with its CUDA 12.9 driver.
[tool.uv.sources]
torch = [
    { index = "pytorch-cu129", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true
